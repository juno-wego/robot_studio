slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /wego_scan
    use_map_saver: true
    mode: mapping
    transform_publish_period: 0.05
    transform_timeout: 0.25
    map_update_interval: 2.0
    resolution: 0.05
    min_laser_range: 0.35
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.12
    minimum_travel_heading: 0.15
